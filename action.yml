name: 'Veracode Fix for SCA'
description: 'Automatically fixes vulnerabilities detected by Veracode SCA'
inputs:
  sca-scan-run-id:
    description: "GitHub Actions run ID containing the SCA scan artifact"
    required: true
  sca-scan-artifact-id:
    description: "Artifact ID of the SCA scan results"
    required: true
  workflow-run-id:
    description: "GitHub workflow run ID for fire-and-forget async callback"
    required: true
  fix-sca-params:
    description: "Additional parameters for Fix SCA command (e.g., SCA-123 or SCA-*)"
    required: false
  fix-remote:
    description: "Fix remote flag (default: true)"
    required: false
    default: 'true'

runs:
  using: "node24"
  main: "dist/index.js"
